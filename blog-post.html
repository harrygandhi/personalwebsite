<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Brygada 1918',serif;background:#faf8f5;color:#1a1a1a;-webkit-font-smoothing:antialiased;}

nav{display:flex;justify-content:flex-end;align-items:center;gap:28px;padding:22px 48px;}
nav a{color:#1a1a1a;text-decoration:none;font-size:14px;letter-spacing:.3px;transition:opacity .3s;}
nav a:hover{opacity:.5;}
.nav-sub{display:flex;align-items:center;gap:0;margin-left:8px;}
.nav-sub input{font-family:inherit;font-size:12px;border:1px solid #ccc;padding:7px 10px;width:160px;outline:none;background:#fff;border-radius:0;}
.nav-sub input::placeholder{color:#c4c0ba;}
.nav-sub button{font-family:inherit;font-size:12px;background:#1a1a1a;color:#fff;border:none;padding:7px 14px;cursor:pointer;white-space:nowrap;}
.nav-sub button:hover{background:#333;}

/* Loading animation */
.loading-wrap{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;background:#faf8f5;
  transition:opacity 0.6s ease;
}
.loading-wrap.hide{opacity:0;pointer-events:none;}
.sunflower-stack{
  position:relative;width:160px;height:320px;margin-bottom:24px;
}
.sunflower-stack img{
  position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;
}
.sunflower-stack .sf-color{
  clip-path:inset(100% 0 0 0);
  animation:fillUp 2.8s ease-in-out infinite;
}
@keyframes fillUp{
  0%{clip-path:inset(100% 0 0 0);}
  60%,75%{clip-path:inset(0 0 0 0);}
  90%,100%{clip-path:inset(100% 0 0 0);}
}
.loading-text{font-size:13px;color:#b0a99e;letter-spacing:0.04em;}

.page{max-width:1060px;margin:0 auto;padding:48px 40px 100px;position:relative;}
.content{max-width:540px;margin-left:auto;position:relative;}

h1{font-size:40px;font-weight:700;line-height:1.18;margin-bottom:16px;letter-spacing:-.3px;}

.meta{font-size:13px;color:#aaa;margin-bottom:48px;font-weight:400;}
.meta .bar{margin:0 8px;color:#ccc;}

.body h2{font-size:19px;font-weight:700;margin:40px 0 16px;}
.body p{font-size:15px;color:#3a3a3a;line-height:1.85;margin-bottom:20px;}
.body strong{font-weight:600;}
.body em{font-style:italic;}
.body ul,.body ol{font-size:15px;color:#3a3a3a;line-height:1.85;margin:0 0 20px 24px;}
.body li{margin-bottom:8px;}
.body ul{list-style-type:disc;}
.body ol{list-style-type:decimal;}

.a{color:#c47a3a;cursor:pointer;border-bottom:1px solid transparent;transition:border-color .2s;text-decoration:none;}
.a:hover,.a.on{border-bottom-color:#c47a3a;}

/* ── MARGIN NOTES — no dashed line ── */
.mn{
  position:absolute;
  right:calc(100% + 48px);
  width:195px;
  opacity:0;
  transform:translateY(5px);
  transition:opacity .35s, transform .35s;
  pointer-events:none;
  z-index:10;
}
.mn.show{opacity:1;transform:translateY(0);pointer-events:auto;}

/* Single title — larger */
.mn-ttl{font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:3px;}
.mn-ph{font-size:12.5px;color:#aaa;font-style:italic;margin-bottom:7px;}
.mn-txt{font-size:12px;color:#888;line-height:1.55;margin-bottom:7px;}
.mn-txt .hl{color:#c47a3a;font-weight:500;}
.mn-img{width:100%;display:block;margin-bottom:10px;border-radius:2px;}
.mn-cap{font-size:10px;color:#aaa;font-style:italic;margin-top:-6px;margin-bottom:8px;}
.mn-lnk{font-size:12px;color:#c47a3a;text-decoration:none;}
.mn-lnk:hover{text-decoration:underline;}
.mn-lnk::after{content:' ↗';font-size:10px;}

.refs{background:#f3ede5;border-radius:6px;padding:30px 34px;margin-top:48px;}
.refs h3{font-size:16px;font-weight:600;margin-bottom:16px;}
.refs ol{padding-left:16px;}
.refs li{font-size:13px;color:#555;line-height:1.6;margin-bottom:5px;list-style-type:lower-alpha;}

hr{border:none;border-top:1px solid #e8e4df;margin:72px 0 0;}

.sub{text-align:center;padding:60px 40px;background:#f5f2ed;}
.sub-row{display:flex;justify-content:center;max-width:400px;margin:0 auto 12px;}
.sub-btn{font-family:inherit;font-size:13px;background:#1a1a1a;color:#fff;border:none;padding:11px 22px;cursor:pointer;transition:background .3s;}
.sub-btn:hover{background:#333;}
.sub-in{font-family:inherit;font-size:13px;border:1px solid #ccc;border-left:none;padding:11px 14px;flex:1;outline:none;background:#fff;}
.sub-in::placeholder{color:#c4c0ba;}

.star{text-align:center;padding:32px 0 48px;font-size:24px;color:#c4a86a;}

  display:none;background:none;border:none;cursor:pointer;
  flex-direction:column;gap:5px;padding:8px;z-index:101;
}
.hamburger span{display:block;width:22px;height:2px;background:#1a1a1a;transition:transform .3s,opacity .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}

.bs-overlay{
  visibility:hidden;opacity:0;
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.4);
  z-index:1000;
  transition:opacity .3s,visibility .3s;
  pointer-events:none;
}
.bs-overlay.show{visibility:visible;opacity:1;pointer-events:auto;}

.bs-card{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;
  border-radius:16px 16px 0 0;
  padding:28px 28px 40px;
  max-height:70vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  z-index:1001;
  transform:translateY(100%);
  transition:transform .35s ease-out;
}
.bs-overlay.show .bs-card{transform:translateY(0);}

.bs-close{
  position:absolute;top:12px;right:16px;
  background:none;border:none;
  font-size:24px;color:#999;cursor:pointer;
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;

.bs-close:hover{color:#333;}

/* ═══════════════════════════════════════════════════════════
   NOTION BLOCK RENDERER
   ═══════════════════════════════════════════════════════════ */
function richTextToHTML(richTexts){
  if(!richTexts) return '';
  let html = '';
  let i = 0;
  function isOrange(rt){ return rt.annotations && (rt.annotations.color === 'orange' || rt.annotations.color === 'orange_background'); }
  function formatSegment(rt){
    let t = (rt.plain_text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(rt.annotations){
      if(rt.annotations.bold) t = `<strong>${t}</strong>`;
      if(rt.annotations.italic) t = `<em>${t}</em>`;
      if(rt.annotations.strikethrough) t = `<s>${t}</s>`;
      if(rt.annotations.underline) t = `<u>${t}</u>`;
      if(rt.annotations.code) t = `<code>${t}</code>`;
    }
    if(rt.href) t = `<a href="${rt.href}" target="_blank" style="color:#c47a3a;">${t}</a>`;
    return t;
  }
  while(i < richTexts.length){
    if(isOrange(richTexts[i])){
      // Group consecutive orange segments into one annotation span
      let triggerParts = [];
      let innerHtml = '';
      while(i < richTexts.length && isOrange(richTexts[i])){
        triggerParts.push(richTexts[i].plain_text || '');
        innerHtml += formatSegment(richTexts[i]);
        i++;
      }
      const fullTrigger = triggerParts.join('').trim().toLowerCase();
      html += `<span class="a" data-trigger="${fullTrigger}">${innerHtml}</span>`;
    } else {
      html += formatSegment(richTexts[i]);
      i++;
    }
  }
  return html;
}

function blocksToHTML(blocks){
  let html = '';
  for(const block of blocks){
    // Skip child_database blocks (we handle those separately for annotations)
    if(block.type === 'child_database') continue;
    switch(block.type){
      case 'heading_1':
        html += `<h2>${richTextToHTML(block.heading_1.rich_text)}</h2>`;break;
      case 'heading_2':
        html += `<h2>${richTextToHTML(block.heading_2.rich_text)}</h2>`;break;
      case 'heading_3':
        html += `<h3>${richTextToHTML(block.heading_3.rich_text)}</h3>`;break;
      case 'paragraph':
        const pText = richTextToHTML(block.paragraph.rich_text);
        if(pText) html += `<p>${pText}</p>`;break;
      case 'bulleted_list_item':
        html += `<ul><li>${richTextToHTML(block.bulleted_list_item.rich_text)}</li></ul>`;break;
      case 'numbered_list_item':
        html += `<ol><li>${richTextToHTML(block.numbered_list_item.rich_text)}</li></ol>`;break;
      case 'quote':
        html += `<blockquote style="border-left:3px solid #c47a3a;padding-left:16px;color:#666;margin:20px 0;">${richTextToHTML(block.quote.rich_text)}</blockquote>`;break;
      case 'divider':
        html += '<hr style="border:none;border-top:1px solid #e8e4df;margin:32px 0;">';break;
      case 'image':
        const imgUrl = block.image.file?.url || block.image.external?.url || '';
        if(imgUrl) html += `<img src="${imgUrl}" style="width:100%;margin:20px 0;border-radius:4px;" alt="">`;break;
      case 'callout':
        html += `<div class="refs"><h3>${block.callout.icon?.emoji||''} ${richTextToHTML(block.callout.rich_text)}</h3></div>`;break;
    }
  }
  html = html.replace(/<\/ul>\s*<ul>/g,'').replace(/<\/ol>\s*<ol>/g,'');
  return html;
}

/* ═══════════════════════════════════════════════════════════
   FETCH ANNOTATIONS from inline "Annotations" database
   
   In Notion, each essay has an inline database at the bottom.
   Database columns:
     Trigger (title)  — the orange text to match
     Label (text)     — "Definition", "[ 1 ]", etc.
     Body (text)      — the popup content
     Phonetic (text)  — optional, e.g. /ˌdefəˈniSHən/
     Link (url)       — optional link
   ═══════════════════════════════════════════════════════════ */
async function fetchAnnotations(blocks){
  // Find the child_database block
  const dbBlock = blocks.find(b => b.type === 'child_database');
  if(!dbBlock) return [];

  try{
    const res = await fetch(`/api/notion/database/${dbBlock.id}`, { method: 'POST' });
    if(!res.ok) return [];
    const data = await res.json();

    return data.results.map(row => {
      const props = row.properties;
      // Image: support Files & Media property (file/external) or URL property
      let image = '';
      if(props.Image){
        if(props.Image.files && props.Image.files.length > 0){
          const f = props.Image.files[0];
          image = f.file?.url || f.external?.url || '';
        } else if(props.Image.url){
          image = props.Image.url;
        } else if(props.Image.rich_text?.[0]?.plain_text){
          image = props.Image.rich_text[0].plain_text;
        }
      }
      return {
        trigger: (props.Trigger?.title || []).map(t => t.plain_text).join('').trim().toLowerCase(),
        label: props.Label?.rich_text?.[0]?.plain_text || '',
        body: props.Body?.rich_text?.[0]?.plain_text || '',
        phonetic: props.Phonetic?.rich_text?.[0]?.plain_text || '',
        link: props.Link?.url || props.Link?.rich_text?.[0]?.plain_text || '',
        image: image
      };
    }).filter(a => a.trigger);
  } catch(e){
    console.error('Failed to fetch annotations:', e);
    return [];
  }
}

/* ═══════════════════════════════════════════════════════════
   WIRE UP MARGIN NOTES
   Matches data-trigger attributes on .a spans to annotations
   ═══════════════════════════════════════════════════════════ */
function wireUpAnnotations(annotations){
  const col = document.getElementById('col');
  const HOVER_DELAY = 600;
  const hideTimers = {};

  // Create margin note elements for each annotation
  const noteEls = {};
  annotations.forEach((ann, i) => {
    const el = document.createElement('div');
    el.className = 'mn';
    el.id = 'mn-' + i;

    let h = '';
    if(ann.label) h += `<div class="mn-ttl">${ann.label}</div>`;
    if(ann.phonetic) h += `<div class="mn-ph">${ann.phonetic}</div>`;
    if(ann.image) h += `<img class="mn-img" src="${ann.image}" alt="">`;
    if(ann.body) h += `<div class="mn-txt">${ann.body}</div>`;
    if(ann.link) h += `<a class="mn-lnk" href="${ann.link}" target="_blank">Link</a>`;

    el.innerHTML = h;
    col.appendChild(el);
    noteEls[ann.trigger] = { el, idx: i };
  });

  // Match .a spans to annotations by trigger text
  document.querySelectorAll('.a[data-trigger]').forEach(span => {
    const trigger = span.dataset.trigger;
    const match = noteEls[trigger];
    if(!match) return;

    const note = match.el;
    const k = match.idx;

    function show(){
      if(hideTimers[k]){ clearTimeout(hideTimers[k]); hideTimers[k]=null; }
      document.querySelectorAll('.mn.show').forEach(n=>{ if(n!==note) n.classList.remove('show'); });
      document.querySelectorAll('.a.on').forEach(n=>{ if(n!==span) n.classList.remove('on'); });
      const sr = span.getBoundingClientRect(), cr = col.getBoundingClientRect();
      note.style.top = (sr.top - cr.top) + 'px';
      note.classList.add('show');
      span.classList.add('on');
    }

    function scheduleHide(){
      hideTimers[k] = setTimeout(()=>{
        if(!note.matches(':hover') && !span.matches(':hover')){
          note.classList.remove('show');
          span.classList.remove('on');
        }
      }, HOVER_DELAY);
    }

    const isMobile = () => window.innerWidth <= 900;

    span.addEventListener('mouseenter', () => { if(!isMobile()) show(); });
    span.addEventListener('mouseleave', () => { if(!isMobile()) scheduleHide(); });
    note.addEventListener('mouseenter', ()=>{ if(!isMobile() && hideTimers[k]){ clearTimeout(hideTimers[k]); hideTimers[k]=null; }});
    note.addEventListener('mouseleave', () => { if(!isMobile()) scheduleHide(); });

    // Mobile: tap to open bottom sheet
    span.addEventListener('click', (e) => {
      if(!isMobile()) return;
      e.preventDefault();
      openBs(annotations[k]);
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   MAIN — FETCH PAGE + ANNOTATIONS FROM NOTION
   ═══════════════════════════════════════════════════════════ */
async function loadPost(){
  // Try to get slug from clean URL path (/writing/slug) or query param fallback
  const pathParts = window.location.pathname.split('/writing/');
  const slug = pathParts.length > 1 ? decodeURIComponent(pathParts[1].replace(/\/$/,'')) : null;
  const params = new URLSearchParams(window.location.search);
  let pageId = params.get('id');

  // If we have a slug but no pageId, query the database to find the page
  if(slug && !pageId){
    try{
      const dbRes = await fetch('/api/notion/database', { method: 'POST' });
      const dbData = await dbRes.json();
      if(dbData.results){
        const match = dbData.results.find(p => {
          const s = p.properties?.Slug?.rich_text?.[0]?.plain_text || '';
          return s === slug;
        });
        if(match) pageId = match.id;
      }
    } catch(e){
      console.error('Failed to look up slug:', e);
    }
  }

  function showPage(){
    document.getElementById('loadingWrap').classList.add('hide');
    document.getElementById('pageWrap').style.display = '';
    document.getElementById('pageHr').style.display = '';
    document.getElementById('footerSub').style.display = '';
    document.getElementById('footerCredit').style.display = '';
    document.getElementById('footerStar').style.display = '';
  }

  if(!pageId){
    showPage();
    loadDemoAnnotations();
    return;
  }

  try{
    // 1. Fetch page metadata
    const pageRes = await fetch(`/api/notion/page/${pageId}`);
    const page = await pageRes.json();

    // If proxy returned an error (env vars not set), show demo
    if(page.error){
      showPage();
      loadDemoAnnotations();
      return;
    }

    // 2. Fetch all blocks (may need pagination for long essays)
    let allBlocks = [];
    let hasMore = true;
    let startCursor = undefined;

    while(hasMore){
      const qs = startCursor ? `?start_cursor=${startCursor}` : '';
      const blocksRes = await fetch(`/api/notion/blocks/${pageId}${qs}`);
      const blocksData = await blocksRes.json();
      allBlocks = allBlocks.concat(blocksData.results);
      hasMore = blocksData.has_more;
      startCursor = blocksData.next_cursor;
    }

    // 3. Extract metadata
    const title = page.properties?.Title?.title?.[0]?.plain_text || 'Untitled';
    const author = page.properties?.Author?.rich_text?.[0]?.plain_text || 'Harry Gandhi';
    const date = page.properties?.['Published Date']?.date?.start || '';
    const formattedDate = date ? new Date(date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';

    // 4. Render content (excluding the annotation database)
    document.getElementById('postTitle').textContent = title;
    document.getElementById('postMeta').innerHTML = `written by ${author}${formattedDate ? ` <span class="bar">|</span> ${formattedDate}` : ''}`;
    document.getElementById('postBody').innerHTML = blocksToHTML(allBlocks);
    document.title = `${title} — Harry Gandhi`;

    // 5. Show article, hide loading
    showPage();

    // 6. Fetch and wire up annotations from inline database
    const annotations = await fetchAnnotations(allBlocks);
    if(annotations.length > 0){
      wireUpAnnotations(annotations);
    }

  } catch(e){
    console.error('Failed to load from Notion:', e);
    showPage();
    loadDemoAnnotations();
  }
}
