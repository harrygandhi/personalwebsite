<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi, I'm Harry</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;min-height:100vh;
  font-family:'Brygada 1918',serif;
  background:#EAE9E7;color:#1a1a1a;
  -webkit-font-smoothing:antialiased;
}
.card{
  max-width:420px;
  margin:0 auto;
  padding:60px 32px 48px;
  display:flex;flex-direction:column;
  align-items:center;
  text-align:center;
  min-height:100vh;
}
.portrait{
  width:120px;height:120px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.05);
  background:#d8d5cf; /* placeholder color while image loads / if missing */
  filter:sepia(0.85);
}
.name{
  font-size:32px;
  font-weight:700;
  letter-spacing:-.3px;
  margin-bottom:14px;
}
.greeting{
  font-size:15px;
  color:#3a3a3a;
  line-height:1.7;
  margin-bottom:6px;
  max-width:320px;
}
.subgreeting{
  font-size:13px;
  color:#8a857b;
  font-style:italic;
  margin-bottom:36px;
}
.divider{
  width:60px;
  height:1px;
  background:rgba(26,26,26,0.15);
  margin:0 auto 32px;
}
.contacts{
  width:100%;
  display:flex;flex-direction:column;
  gap:2px;
}
.contact{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  color:#1a1a1a;
  text-decoration:none;
  border-bottom:1px solid rgba(26,26,26,0.08);
  transition:background 0.2s ease, transform 0.2s ease;
  min-height:56px;
}
.contact:first-child{border-top:1px solid rgba(26,26,26,0.08);}
a.contact:active{transform:scale(0.98);}

/* Brand-tinted hover states */
a.contact[href*="signal.me"]:hover{background:rgba(58,118,240,0.10);}
a.contact[href*="signal.me"]:hover .contact-icon{color:#3A76F0;}

a.contact[href^="mailto:"]:hover{background:rgba(234,67,53,0.09);}
a.contact[href^="mailto:"]:hover .contact-icon{color:#EA4335;}

a.contact[href*="x.com"]:hover{background:rgba(0,0,0,0.06);}
a.contact[href*="x.com"]:hover .contact-icon{color:#000;}

a.contact[href*="linkedin.com"]:hover{background:rgba(10,102,194,0.10);}
a.contact[href*="linkedin.com"]:hover .contact-icon{color:#0A66C2;}

a.contact[href$="harrygandhi.com"]:hover{background:rgba(196,122,58,0.12);}
a.contact[href$="harrygandhi.com"]:hover .contact-icon{color:#c47a3a;}
.contact-text{cursor:default;}
.contact-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.contact-icon{
  width:20px;
  height:20px;
  flex-shrink:0;
  color:#1a1a1a;
  transition:color 0.2s ease;
}
.contact-label{
  font-size:14px;
  font-weight:600;
  letter-spacing:.3px;
}
.contact-handle{
  font-size:13px;
  color:#8a857b;
  font-family:'Brygada 1918',serif;
  font-style:italic;
  max-width:60%;
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.footer{
  margin-top:auto;
  padding-top:40px;
  font-size:11px;
  color:#b0a99e;
  text-align:center;
}

@media(max-width:420px){
  .card{padding:48px 24px 40px;}
  .portrait{width:104px;height:104px;}
  .name{font-size:28px;}
}
</style>
</head>
<body>

<div class="card">
  <img class="portrait" src="/hello-portrait.jpg" alt="Harry Gandhi">
  <h1 class="name">Hi, I'm Harry.</h1>
  <p class="subgreeting">Here's where you'll find me.</p>

  <div class="contacts">
    <a class="contact" href="https://signal.me/#eu/harry.1089" target="_blank" rel="noopener">
      <span class="contact-left">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.16 2 11.28c0 2.08.79 3.99 2.11 5.5L2.7 22l5.35-1.4A10.5 10.5 0 0012 20.55c5.52 0 10-4.16 10-9.28C22 6.16 17.52 2 12 2z"/>
        </svg>
        <span class="contact-label">Signal</span>
      </span>
      <span class="contact-handle">harry.1089</span>
    </a>
    <a class="contact" href="mailto:harry.m.gandhi@gmail.com">
      <span class="contact-left">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1.5"/>
          <path d="M3 7.5l9 6 9-6"/>
        </svg>
        <span class="contact-label">Email</span>
      </span>
      <span class="contact-handle">harry.m.gandhi@gmail.com</span>
    </a>
    <a class="contact" href="https://x.com/TheHarryGandhi" target="_blank" rel="noopener">
      <span class="contact-left">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
        <span class="contact-label">X / Twitter</span>
      </span>
      <span class="contact-handle">@TheHarryGandhi</span>
    </a>
    <a class="contact" href="https://www.linkedin.com/in/harrygandhi/" target="_blank" rel="noopener">
      <span class="contact-left">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        <span class="contact-label">LinkedIn</span>
      </span>
      <span class="contact-handle">linkedin.com/in/harrygandhi</span>
    </a>
    <a class="contact" href="https://harrygandhi.com" target="_blank" rel="noopener">
      <span class="contact-left">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3a13.5 13.5 0 010 18"/>
          <path d="M12 3a13.5 13.5 0 000 18"/>
        </svg>
        <span class="contact-label">Website</span>
      </span>
      <span class="contact-handle">harrygandhi.com</span>
    </a>
  </div>

  <p class="footer">Made with ❤️ by Harry, Nazifa, Om and Claude</p>
</div>

</body>
</html>
