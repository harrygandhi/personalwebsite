<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error 404</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100vh;height:100dvh;overflow:hidden;
  font-family:'Brygada 1918',serif;
  background:#EAE9E7;color:#1a1a1a;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px, 3vh, 40px) 24px;
}
.wrap{
  max-width:520px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.four{
  font-size:clamp(64px, 12vh, 128px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.04em;
  color:#1a1a1a;
  margin-bottom:clamp(16px, 3vh, 36px);
}
.msg{
  font-size:clamp(15px, 2.4vh, 22px);
  line-height:1.5;
  color:#3a3a3a;
  margin-bottom:clamp(20px, 3.5vh, 44px);
  font-style:italic;
}

/* Postcard-framed butterfly — sits between the message and the "back home" link.
   Image sized so total content always fits the viewport (no scroll). */
.postcard{
  position:relative;
  display:inline-block;
  background:#fff;
  padding:8px;
  margin:0 auto clamp(20px, 3.5vh, 48px);
  box-shadow:0 6px 22px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
  max-width:100%;
}
.postcard img{
  display:block;
  max-width:min(440px, 82vw);
  max-height:34vh;
  width:auto;
  height:auto;
}
.postcard .tape{
  position:absolute;
  background:linear-gradient(170deg,
    rgba(240, 228, 195, 0.55) 0%,
    rgba(220, 208, 175, 0.45) 50%,
    rgba(240, 228, 195, 0.55) 100%);
  border-left:1px dashed rgba(150, 135, 105, 0.18);
  border-right:1px dashed rgba(150, 135, 105, 0.18);
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
  z-index:3;
  pointer-events:none;
}
.postcard .tape.tl{top:-9px; left:20px; width:72px; height:20px; transform:rotate(-9deg);}
.postcard .tape.tr{top:-9px; right:20px; width:72px; height:20px; transform:rotate(7deg);}
.postcard .tape.bc{bottom:-9px; left:50%; margin-left:-38px; width:76px; height:20px; transform:rotate(-3deg);}
.home{
  display:inline-block;
  font-size:15px;
  color:#c47a3a;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s ease;
  letter-spacing:.3px;
}
.home:hover{border-bottom-color:#c47a3a;}
.arrow{margin-right:6px;display:inline-block;transition:transform .3s ease;}
.home:hover .arrow{transform:translateX(-3px);}

.footer{
  position:absolute;
  bottom:18px;
  left:0;right:0;
  text-align:center;
  font-size:11px;
  color:#b0a99e;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="four">404</div>
  <p class="msg">This page seems to live in the in-between.</p>
  <div class="postcard">
    <div class="tape tl"></div>
    <div class="tape tr"></div>
    <div class="tape bc"></div>
    <img src="/butterfly-new.png" alt="">
  </div>
  <a class="home" href="/"><span class="arrow">←</span> back home</a>
</div>

<p class="footer">Made with ❤️ by Harry, Nazifa, Om and Claude</p>

</body>
</html>
